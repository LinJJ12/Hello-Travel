services:
  backend:
    build:
      context: ./backend
    image: hello-travel-backend:latest
    env_file:
      - ./backend/.env
    environment:
      # 容器内监听 0.0.0.0，供前端 nginx 反代访问
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # 高德地图 JS Key 需在构建期注入（可从根目录 .env 读取）
        VITE_AMAP_WEB_JS_KEY: ${VITE_AMAP_WEB_JS_KEY:-}
        # 留空表示使用相对路径，由 nginx 反代 /api 到 backend
        VITE_API_BASE_URL: ""
    image: hello-travel-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
